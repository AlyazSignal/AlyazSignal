<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ALYAZ SIGNAL</title>
    <!-- Favicon: Logo baru di tab browser -->
    <link rel="icon" type="image/png" href="https://i.ibb.co.com/xtTzNbX1/20260820-175614.png">
    <!-- Open Graph untuk Media Sosial -->
    <meta property="og:title" content="ALYAZ SIGNAL">
    <meta property="og:description" content="Platform Informasi Pasar Modal & Kalkulator Saham">
    <meta property="og:image" content="https://i.ibb.co.com/xtTzNbX1/20260820-175614.png">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .iframe-box { width: 100%; height: 100%; border: none; background-color: #050505; }
        ::-webkit-scrollbar { width: 4px; height: 4px; }
        ::-webkit-scrollbar-track { background: #050505; }
        ::-webkit-scrollbar-thumb { background: #1e293b; border-radius: 2px; }
    </style>
</head>
<body class="bg-[#050505] text-slate-100 h-screen flex flex-col overflow-hidden font-sans select-none">

    <!-- HEADER: Logo Teks (Alyaz Biru, Signal Kuning) -->
    <header class="bg-[#0b0f19] px-2 py-2 text-center border-b border-blue-950/40 shadow-2xl z-50 flex items-center justify-center shrink-0">
        <div class="flex items-center gap-1.5">
            <span class="text-2xl font-black text-blue-500 tracking-tight">Alyaz</span>
            <span class="text-2xl font-bold text-yellow-400 tracking-tight">Signal</span>
        </div>
    </header>

    <!-- KONTEN UTAMA -->
    <main class="flex-grow bg-[#050505] relative overflow-hidden pb-12 px-1 pt-1">
        
        <!-- 1. MENU BERITA -->
        <div id="view-berita" class="h-full flex flex-col">
            <div class="flex-grow rounded-lg overflow-hidden border border-blue-950/30 bg-[#050505] shadow-2xl">
                <iframe src="https://www.idnfinancials.com/id/news" class="iframe-box" title="Berita"></iframe>
            </div>
        </div>

        <!-- 2. MENU KALKULATOR -->
        <div id="view-kalkulator" class="hidden h-full flex flex-col">
            <div class="flex-grow rounded-lg overflow-hidden border border-blue-950/30 bg-[#050505] shadow-2xl">
                <iframe src="https://alyazsignal.github.io/KALKULATOR-SAHAM-ALYAZ-SIGNAL/" class="iframe-box" title="Kalkulator"></iframe>
            </div>
        </div>

        <!-- 3. MENU LOGIN -->
        <div id="view-login" class="hidden h-full flex flex-col space-y-1">
            <div class="grid grid-cols-3 gap-1 shrink-0">
                <button onclick="gantiSekuritas('https://stockbit.com/login', this)" class="btn-sekuritas bg-blue-600 text-white py-1 rounded-md text-[11px] font-semibold">Stockbit</button>
                <button onclick="gantiSekuritas('https://www.tuntun.co.id/', this)" class="btn-sekuritas bg-[#0b0f19] text-slate-300 border border-blue-950/60 py-1 rounded-md text-[11px]">Tuntun</button>
                <button onclick="gantiSekuritas('https://login.ajaib.co.id/', this)" class="btn-sekuritas bg-[#0b0f19] text-slate-300 border border-blue-950/60 py-1 rounded-md text-[11px]">Ajaib</button>
            </div>
            <div class="flex-grow rounded-lg overflow-hidden border border-blue-950/30 bg-[#050505] shadow-2xl">
                <iframe id="iframe-login" src="https://stockbit.com/login" class="iframe-box" title="Login"></iframe>
            </div>
        </div>
    </main>

    <!-- NAVIGASI BAWAH: 3 Menu (Kalkulator tidak disingkat) -->
    <nav class="bg-[#080c14] border-t border-blue-950/50 py-1 fixed bottom-0 left-0 right-0 z-50">
        <div class="grid grid-cols-3 text-center text-[10px]">
            <button onclick="gantiTab('berita')" id="btn-berita" class="nav-btn flex flex-col items-center text-amber-400"><span>📰</span><span>Berita</span></button>
            <button onclick="gantiTab('kalkulator')" id="btn-kalkulator" class="nav-btn flex flex-col items-center text-slate-400"><span>🧮</span><span>Kalkulator</span></button>
            <button onclick="gantiTab('login')" id="btn-login" class="nav-btn flex flex-col items-center text-slate-400"><span>💼</span><span>Login</span></button>
        </div>
    </nav>

    <script>
        function gantiTab(tab) {
            ['berita', 'kalkulator', 'login'].forEach(v => {
                document.getElementById('view-' + v).classList.add('hidden');
                document.getElementById('btn-' + v).classList.replace('text-amber-400', 'text-slate-400');
            });
            document.getElementById('view-' + tab).classList.remove('hidden');
            document.getElementById('btn-' + tab).classList.replace('text-slate-400', 'text-amber-400');
        }
        function gantiSekuritas(url, el) {
            document.getElementById('iframe-login').src = url;
            document.querySelectorAll('.btn-sekuritas').forEach(b => b.classList.replace('bg-blue-600', 'bg-[#0b0f19]'));
            el.classList.replace('bg-[#0b0f19]', 'bg-blue-600');
        }
    </script>
</body>
</html>
